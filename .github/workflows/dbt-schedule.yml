# Codzienny dbt build na prod — z ostatniego commita na main, dla którego dbt CI/CD (dbt-ci-cd.yml)
# skończył się na zielono, a nie z głowy main: kod odrzucony przez CI nie trafia na prod
# także harmonogramem. GitHub loguje się do GCP przez Workload Identity Federation:
# dostaje krótkotrwały token dla konta serwisowego, bez pliku klucza w sekretach.
# Jednorazowa konfiguracja GCP i sekretów: dbt/README.md, sekcja „Konfiguracja GCP”.
name: dbt schedule

on:
  schedule:
    # UTC. Dzienna tabela GA4 pojawia się o różnych porach następnego dnia; spóźniony dzień
    # nadrobi kolejny przebieg, bo staging nadpisuje 3 dni wstecz. Cron GitHuba bywa opóźniony.
    - cron: "0 10 * * *"
  workflow_dispatch:  # ręczne uruchomienie z zakładki Actions
    inputs:
      full_refresh:
        description: "Pełny rebuild (--full-refresh) — po zmianie stg_ga4__zdarzenia, inaczej ostatnie dni dostaną nową logikę, a starsze zostaną ze starą; czyta GA4 od ga4_data_startu"
        type: boolean
        default: false

# Dwa przebiegi naraz nadpisywałyby te same partycje. Grupa nie kolejkuje: czeka najwyżej jeden
# przebieg, nowszy (np. deploy) anuluje oczekujący cron — dzień nadrobi następny przebieg.
concurrency:
  group: dbt-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read    # gh run list — historia przebiegów dbt CI/CD
      id-token: write  # token OIDC dla Workload Identity Federation
    defaults:
      run:
        working-directory: dbt
    env:
      BIGQUERY_PROD_PROJECT: ${{ secrets.BIGQUERY_PROD_PROJECT }}
    steps:
      # Zielony = cały przebieg dbt CI/CD (parse, unit-tests i deploy). Commity bez zmian w dbt/
      # albo tylko w *.md nie odpalają CI, ale nie zmieniają modeli, więc ostatni zielony ma ten sam kod.
      - name: ostatni commit z zielonym CI
        id: green
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dbt-ci-cd.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$SHA" ]; then
            echo "::error::Na main nie ma commita z zielonym dbt CI/CD — nie ma czego budować."
            exit 1
          fi
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::Buduję $SHA (ostatni zielony CI), nie $GITHUB_SHA (głowa main)."
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cp profiles.yml.example profiles.yml
      - run: uv run dbt deps
      # Tylko dane syntetyczne: generator dopisuje dni od ostatniej tabeli events_ do wczoraj (zamiast
      # eksportu GA4, który robi to sam). Klient BigQuery z dbt-bigquery, logowanie z kroku auth.
      # Prawdziwy eksport GA4 → usuń ten krok.
      - name: generator danych syntetycznych
        run: |
          uv run python -c "
          from google.cloud import bigquery
          sql = open('../dane_syntetyczne/generuj_eksport_ga4.sql').read()
          bigquery.Client(project='$BIGQUERY_PROD_PROJECT').query(sql, location='EU').result()
          "
      # unit testy sprawdzają logikę, nie dane — biegną przy zmianie kodu, nie co dzień na prod
      - run: uv run dbt build --target prod_ci --profiles-dir . --exclude-resource-type unit_test ${{ inputs.full_refresh && '--full-refresh' || '' }}
      # run_results.json pokazuje, który model albo test padł; artefakt żyje 14 dni
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-run-results
          path: dbt/target/run_results.json
          retention-days: 14
