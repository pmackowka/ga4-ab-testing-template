<script>
/*
 03 · DWA WARIANTY, ale tylko 50% użytkowników karty produktu w teście
 GTM → Tag → Custom HTML. Wyzwalacz: karta produktu, po zgodzie.
 Połowa userów trafia do testu (v0/v1 po 25% całego ruchu), druga połowa
 dostaje ciasteczko 'out': widzi obecną wersję strony i NIE wchodzi do analizy
 (bez ab_assign; zmienna_ab_variant.js zwraca dla 'out' undefined, więc tagi
 GA4 nie wysyłają ab_variant). Po co: mniejsze ryzyko, gdy wariant może
 szkodzić — kosztem dłuższego testu (połowa ruchu → ok. 2× więcej tygodni).
 Rozszerzenie na cały ruch: 04_rozszerzenie_do_100_procent.html.
*/
(function () {
  var TEST = 'ab3';
  var RUN = '20261102';         // przebieg = start_testu z seeda (RRRRMMDD); nowy test w tym slocie = nowy RUN
  var VARIANTS = ['v0', 'v1'];  // v0 = wersja dotychczasowa, v1 = wariant testowy
  var ALLOCATION = 0.5;   // udział ruchu w teście: 0.5 = 50%
  var OUT = 'out';        // znacznik „poza testem” — pamiętany, żeby nie losować co wizytę
  var DAYS = 60;

  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setCookie(name, value, days) {
    var exp = new Date(Date.now() + days * 864e5);
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
  }

  // ciasteczko = wariant.RUN; ciasteczko z poprzedniego testu w tym slocie
  // (inny RUN) traktujemy jak brak przydziału, więc slot można użyć ponownie
  function getAssignment() {
    var parts = (getCookie(TEST) || '').split('.');
    return parts[1] === RUN ? parts[0] : null;
  }

  // przydział już jest — wariant albo 'out'; oba zostają bez zmian
  if (getAssignment()) return;

  // pierwsze losowanie: czy user w ogóle wchodzi do testu
  if (Math.random() >= ALLOCATION) {
    setCookie(TEST, OUT + '.' + RUN, DAYS);
    return;
  }

  // drugie, niezależne losowanie: który wariant — wśród wpuszczonych 50/50
  var variant = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
  setCookie(TEST, variant + '.' + RUN, DAYS);

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'ab_assign', ab_test: TEST, ab_variant: variant });
})();
</script>
