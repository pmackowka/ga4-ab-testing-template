<script>
/*
 04 · ROZSZERZENIE testu z 03 do 100% ruchu
 GTM → podmień kod tagu z 03 na ten (ten sam tag, ten sam wyzwalacz) i opublikuj.
 - userzy z v0/v1 zostają w swoim wariancie — przydział się nie zmienia,
 - userzy z 'out' i nowi dostają wariant 50/50 i ab_assign.
 sql/02 liczy każdego od pierwszej ekspozycji z wariantem, więc dawni 'out'
 wchodzą do analizy od dnia rozszerzenia. Zastrzeżenie: wcześniej widzieli
 obecną wersję strony, więc w v1 część z nich porównuje nowość ze starym —
 jeśli to ważne, ustaw INCLUDE_OUT = false: wtedy wchodzą tylko nowi userzy.
 To nie jest wdrożenie zwycięzcy — test trwa dalej, tylko na całym ruchu.
*/
(function () {
  var TEST = 'ab_cta';          // ta sama nazwa co w 03 — inaczej przydziały by się zgubiły
  var VARIANTS = ['v0', 'v1'];
  var OUT = 'out';
  var INCLUDE_OUT = true;       // false = dawni 'out' zostają poza testem
  var DAYS = 30;

  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setCookie(name, value, days) {
    var exp = new Date(Date.now() + days * 864e5);
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
  }

  var current = getCookie(TEST);

  // ma wariant — zostaje; 'out' zostaje tylko przy INCLUDE_OUT = false
  if (current && (current !== OUT || !INCLUDE_OUT)) return;

  // nowy user albo dawny 'out': cały ruch wchodzi do testu, 50/50
  var variant = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
  setCookie(TEST, variant, DAYS);

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'ab_assign', ab_test: TEST, ab_variant: variant });
})();
</script>
