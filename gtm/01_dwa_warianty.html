<script>
/*
 01 · DWA WARIANTY, 50/50, cały ruch strony testowej
 GTM → Tag → Custom HTML. Wyzwalacz: strona testowa (np. karta produktu),
 dopiero po zgodzie na ciasteczka. Losuje raz, zapisuje wariant w first-party
 cookie i wysyła ab_assign do dataLayer — z niego liczy sql/03.
*/
(function () {
  var TEST = 'ab1';             // slot ab1–ab10 = nazwa ciasteczka i parametru GA4 = test_name w sql/03 i slot w seedzie
  var RUN = '20260907';         // przebieg = start_testu z seeda (RRRRMMDD); nowy test w tym slocie = nowy RUN
  var VARIANTS = ['v0', 'v1'];  // v0 = wersja dotychczasowa (kontrola), v1 = wariant testowy
  var DAYS = 60;                // > najdłuższy test (8 tyg.); Safari i tak skraca ciasteczko z JS do 7 dni (ITP)

  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setCookie(name, value, days) {
    var exp = new Date(Date.now() + days * 864e5);
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
  }

  // ciasteczko = wariant.RUN; ciasteczko z poprzedniego testu w tym slocie
  // (inny RUN) traktujemy jak brak przydziału, więc slot można użyć ponownie
  function getAssignment() {
    var parts = (getCookie(TEST) || '').split('.');
    return parts[1] === RUN ? parts[0] : null;
  }

  // user ma już wariant — nie losuj ponownie, bo przeskoczyłby do innej grupy
  if (getAssignment()) return;

  // Math.random() daje liczbę z [0, 1); × liczba wariantów i zaokrąglenie
  // w dół daje indeks 0 albo 1 z równym prawdopodobieństwem
  var variant = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
  setCookie(TEST, variant + '.' + RUN, DAYS);

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'ab_assign', ab_test: TEST, ab_variant: variant });
})();
</script>
