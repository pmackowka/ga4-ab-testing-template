<script>
/*
 02 · TRZY WARIANTY (A/B/C), po 1/3, cały ruch strony testowej
 GTM → Tag → Custom HTML. Różni się od 01 tylko listą VARIANTS — losowanie
 indeksu działa dla dowolnej liczby wariantów.
 Analiza: sql/03 zwróci wiersz kontroli i po wierszu na v1, v2; każdą parę
 z kontrolą wpisz do kalkulatora osobno, z „Liczba wariantów” = 3
 (kalkulator zaostrza wtedy próg p-value — korekta Bonferroniego).
 W sql/03 ustaw test_name = 'ab2' i variants = ['v0', 'v1', 'v2'] (w dbt: wiersz ab2 z v0|v1|v2
 w dbt/seeds/rejestr_testow.csv); parametr ab2 = zmienna „Własny plik cookie” ab2.
*/
(function () {
  var TEST = 'ab2';                   // osobny numer — nie mieszaj z testem ab1
  var VARIANTS = ['v0', 'v1', 'v2'];  // v0 = wersja dotychczasowa, v1 i v2 = warianty testowe
  var DAYS = 60;

  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setCookie(name, value, days) {
    var exp = new Date(Date.now() + days * 864e5);
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
  }

  // ciasteczko = sam wariant (albo 'out'); slot wraca do użycia dopiero po wygaśnięciu
  // ciasteczek poprzedniego testu — pilnuje tego sprawdz_konfiguracje_testow w dbt
  // wartość spoza listy (śmieć, ręczna edycja) = brak przydziału, user losuje od nowa
  function getAssignment() {
    var v = getCookie(TEST);
    return VARIANTS.indexOf(v) > -1 ? v : null;
  }

  if (getAssignment()) return;

  // indeks 0, 1 albo 2, każdy z prawdopodobieństwem 1/3
  var variant = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
  setCookie(TEST, variant, DAYS);

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'ab_assign', ab_test: TEST, ab_variant: variant });
})();
</script>
