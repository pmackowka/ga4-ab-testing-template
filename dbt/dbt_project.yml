# Projekt dbt: wyniki testów A/B z eksportu GA4 (odpowiednik sql/03).
name: 'testy_ab'  # nie 'dbt_bigquery' — tę nazwę zajmuje wewnętrzny pakiet makr adaptera
version: '1.0.0'
config-version: 2
profile: 'testy_ab'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Eksport GA4: projekt i dataset z tabelami events_YYYYMMDD — jedyne miejsce do podmiany.
  ga4_projekt: 'twoj-projekt'
  ga4_zbior_danych: 'analytics_123456789'
  # Pierwszy dzień, który czyta pełny rebuild stg_ga4__zdarzenia (--full-refresh). Ustaw na
  # najwcześniejszy start_testu z seeds/rejestr_testow.csv: każdy dzień wcześniej to koszt bez pożytku.
  ga4_data_startu: '2026-09-07'

models:
  testy_ab:
    +persist_docs:
      relation: true
      columns: true
    # Dev i CI: tabele znikają po 1 h. Prod: bez wygasania, bo expiration kasuje tabelę bez błędu w dbt.
    +hours_to_expiration: "{{ 1 if target.name in ['dev', 'ci'] else none }}"
    staging:
      +materialized: view
    # view: intermediate czytają tylko marty, osobna tabela byłaby kopią bez odbiorcy
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  testy_ab:
    rejestr_testow:
      +column_types:
        slot: string
        start_testu: date
        koniec_testu: date
        wariant_kontrolny: string
        warianty: string
        zdarzenie_konwersji: string
        zdarzenia_ekspozycji: string
