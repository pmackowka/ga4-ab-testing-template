version: 2

seeds:
  - name: ab_tests
    description: >
      Rejestr testów A/B — jeden wiersz na test, zamiast DECLARE w sql/03. Nowy test = nowy wiersz.
      Listy rozdziela „|”, bo CSV nie ma typu tablicowego; stg_seeds__ab_tests robi z nich ARRAY.
      Wiersze odpowiadają tagom z gtm/: ab1 = 01_dwa_warianty, ab2 = 02_trzy_warianty,
      ab3 = 03_dwa_warianty_50_procent i 04_rozszerzenie_do_100_procent (jeden test, ten sam klucz;
      'out' nie ma ab_variant, więc nie ma go w variants). Testy idą po sobie, bo jeden parametr
      ab_test na evencie mieści tylko jeden test naraz na tej samej stronie.
    columns:
      - name: test_name
        description: Klucz testu, = TEST w tagu GTM i parametr ab_test w GA4.
      - name: test_start
        description: Poniedziałek publikacji tagu.
      - name: test_end
        description: Niedziela, ostatni dzień testu.
      - name: control_variant
        description: Wersja dotychczasowa, musi być na liście variants.
      - name: variants
        description: Warianty rozdzielone „|”, = VARIANTS w tagu GTM.
      - name: conversion_event
        description: >
          Nazwa eventu GA4 liczonego jako konwersja. Nowa nazwa, której nie ma jeszcze żaden test,
          wymaga `dbt build --full-refresh -s stg_ga4__events`: staging trzyma tylko eventy
          z parametrem ab_test i eventy konwersji z tego seeda.
      - name: exposure_events
        description: >
          Eventy rozdzielone „|”, na których użytkownik wchodzi do testu (pierwszy z wariantem).
