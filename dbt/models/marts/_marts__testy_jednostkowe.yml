# UNIT

# Unit testy: sprawdzają, czy LOGIKA modelu jest poprawna — wiersze z given zamiast ref(),
# wynik porównany z expect. Plik YAML. Biegną tylko w CI (job unit-testy), przed modelem;
# deploy i harmonogram je pomijają.
version: 2

unit_tests:
  - name: wyniki_bez_mieszanych_z_pustym_wariantem
    description: >
      Ponownie wylosowany (u3) idzie do wykluczeni_mieszani, nie do uzytkownicy ani konwertujacy. Wariant v2
      z seeda bez użytkowników zostaje jako wiersz z zerami.
    model: fct_wyniki_testow_ab
    given:
      - input: ref('stg_seeds__rejestr_testow')
        format: sql
        rows: |
          SELECT 'ab2_20260907' AS id_testu, 'ab2' AS slot, DATE '2026-09-07' AS start_testu, DATE '2026-10-04' AS koniec_testu,
            'v0' AS wariant_kontrolny, ['v0', 'v1', 'v2'] AS warianty, 'purchase' AS zdarzenie_konwersji,
            ['ab_assign', 'view_item'] AS zdarzenia_ekspozycji, 28 AS dni_testu, TRUE AS czy_koncowy
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab2_20260907, id_uzytkownika: u1, wariant: v0, liczba_wariantow: 1}
          - {id_testu: ab2_20260907, id_uzytkownika: u2, wariant: v1, liczba_wariantow: 1}
          - {id_testu: ab2_20260907, id_uzytkownika: u3, wariant: v1, liczba_wariantow: 2}
      - input: ref('int_ab__konwersje')
        rows:
          - {id_testu: ab2_20260907, id_uzytkownika: u2}
          - {id_testu: ab2_20260907, id_uzytkownika: u3}
    expect:
      rows:
        - {id_testu: ab2_20260907, wariant: v0, pole_kalkulatora: 'A (kontrola)', uzytkownicy: 1, konwertujacy: 0, wykluczeni_mieszani: 0}
        - {id_testu: ab2_20260907, wariant: v1, pole_kalkulatora: 'B (wariant v1)', uzytkownicy: 1, konwertujacy: 1, wykluczeni_mieszani: 1}
        - {id_testu: ab2_20260907, wariant: v2, pole_kalkulatora: 'B (wariant v2)', uzytkownicy: 0, konwertujacy: 0, wykluczeni_mieszani: 0}

  - name: tygodniowo_wyklucza_mieszanych_od_ich_tygodnia
    description: >
      u2 wylosowany ponownie w tygodniu 2: w tygodniu 1 liczy się jako user, od tygodnia 2
      jako wykluczeni_mieszani. Konwersja u1 w tygodniu 2 pojawia się dopiero w tygodniu 2.
    model: fct_wyniki_testow_ab_tygodniowo
    given:
      - input: ref('stg_seeds__rejestr_testow')
        format: sql
        rows: |
          SELECT 'ab1_20260907' AS id_testu, 'ab1' AS slot, DATE '2026-09-07' AS start_testu, DATE '2026-09-20' AS koniec_testu,
            'v0' AS wariant_kontrolny, ['v0', 'v1'] AS warianty, 'purchase' AS zdarzenie_konwersji,
            ['ab_assign', 'view_item'] AS zdarzenia_ekspozycji, 14 AS dni_testu, TRUE AS czy_koncowy
      - input: ref('fct_wyniki_testow_ab')
        rows:
          - {id_testu: ab1_20260907, wariant: v0}
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab1_20260907, id_uzytkownika: u1, wariant: v0, data_pierwszej_ekspozycji: 2026-09-08, data_mieszania: null}
          - {id_testu: ab1_20260907, id_uzytkownika: u2, wariant: v0, data_pierwszej_ekspozycji: 2026-09-09, data_mieszania: 2026-09-15}
      - input: ref('int_ab__konwersje')
        rows:
          - {id_testu: ab1_20260907, id_uzytkownika: u1, data_pierwszej_konwersji: 2026-09-16}
    expect:
      rows:
        - {id_testu: ab1_20260907, wariant: v0, nr_tygodnia: 1, uzytkownicy: 2, konwertujacy: 0, wykluczeni_mieszani: 0}
        - {id_testu: ab1_20260907, wariant: v0, nr_tygodnia: 2, uzytkownicy: 1, konwertujacy: 1, wykluczeni_mieszani: 1}
