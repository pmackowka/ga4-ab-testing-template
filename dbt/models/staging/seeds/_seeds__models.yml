# GENERIC

# data_tests: = użycie testów generic, które sprawdzają, czy DANE są poprawne. Definicje: not_null
# i unique wbudowane w dbt, dbt_utils.* z pakietu (dbt deps), variant_in_seed w tests/generic/.
version: 2

models:
  - name: stg_seeds__ab_tests
    description: Rejestr testów z seeds/ab_tests.csv z listami jako ARRAY<STRING>.
    columns:
      - name: test_id
        description: Klucz testu — slot i przebieg, np. ab1_20260907; przebieg = RUN w tagu GTM.
        data_tests:
          - unique
          - not_null
      - name: test_name
        description: Slot ab1–ab10 — nazwa ciasteczka i parametru eventu; wraca w kolejnych testach.
        data_tests:
          - not_null
      - name: test_start
        data_tests:
          - not_null
      - name: test_end
        data_tests:
          - not_null
      - name: control_variant
        data_tests:
          - not_null
      - name: variants
      - name: conversion_event
        data_tests:
          - not_null
      - name: exposure_events
      - name: test_days
        description: Długość testu w dniach.
      - name: is_final
        description: >
          true, gdy od test_end minęły co najmniej 3 dni i GA4 nie dopisze już danych.
          Do kalkulatora bierz tylko wiersze z is_final = true.
