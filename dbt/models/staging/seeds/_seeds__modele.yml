# GENERIC

# data_tests: = użycie testów generic, które sprawdzają, czy DANE są poprawne. Definicje: not_null
# i unique wbudowane w dbt, dbt_utils.* z pakietu (dbt deps), wariant_w_seedzie w tests/generic/.
version: 2

models:
  - name: stg_seeds__rejestr_testow
    description: Rejestr testów z seeds/rejestr_testow.csv z listami jako ARRAY<STRING>.
    columns:
      - name: id_testu
        description: Klucz testu — slot i przebieg, np. ab1_20260907.
        data_tests:
          - unique
          - not_null
      - name: slot
        description: Slot ab1–ab10 — nazwa ciasteczka i parametru eventu; wraca w kolejnych testach.
        data_tests:
          - not_null
      - name: start_testu
        data_tests:
          - not_null
      - name: koniec_testu
        data_tests:
          - not_null
      - name: wariant_kontrolny
        data_tests:
          - not_null
      - name: warianty
      - name: zdarzenie_konwersji
        data_tests:
          - not_null
      - name: zdarzenia_ekspozycji
      - name: dni_testu
        description: Długość testu w dniach.
      - name: czy_koncowy
        description: >
          true, gdy od koniec_testu minęły co najmniej 3 dni i GA4 nie dopisze już danych.
          Do kalkulatora bierz tylko wiersze z czy_koncowy = true.
