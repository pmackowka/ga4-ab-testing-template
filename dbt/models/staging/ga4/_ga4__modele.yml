version: 2

models:
  - name: stg_ga4__zdarzenia
    description: >
      Jeden wiersz na event i test: eventy z wariantem dowolnego testu (parametr slotu albo
      ab_assign) oraz eventy konwersji z seeda, bez użytkowników bez user_pseudo_id.
      Partycje dzienne, ostatnie 3 dni nadpisywane przy każdym przebiegu.
    columns:
      - name: data_zdarzenia
        description: Dzień z sufiksu tabeli eksportu (strefa czasowa usługi GA4).
        data_tests:
          - not_null
      - name: czas_zdarzenia
        description: Czas eventu (UTC).
        data_tests:
          - not_null
      - name: id_uzytkownika
        description: user_pseudo_id z GA4 — identyfikator przeglądarki z cookie _ga.
        data_tests:
          - not_null
      - name: nazwa_zdarzenia
        description: event_name z GA4.
      - name: przychod
        description: ecommerce.purchase_revenue — przychód zakupu w walucie usługi GA4; NULL poza zakupem.
      - name: id_transakcji
        description: ecommerce.transaction_id — po nim int_ab__konwersje liczy zamówienie raz.
      - name: slot
        description: Slot testu — z ab_test na ab_assign, z nazwy parametru (ab1…ab10) na pozostałych eventach; NULL dla konwersji bez testu.
      - name: wariant
        description: Wariant — z ab_variant na ab_assign, z wartości parametru slotu na pozostałych eventach.
