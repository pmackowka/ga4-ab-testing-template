version: 2

models:
  - name: stg_ga4__events
    description: >
      Eventy GA4 z parametrem ab_test oraz eventy konwersji z seeda, bez użytkowników bez
      user_pseudo_id. Partycje dzienne, ostatnie 3 dni nadpisywane przy każdym przebiegu.
    columns:
      - name: event_date
        description: Dzień z sufiksu tabeli eksportu (strefa czasowa usługi GA4).
        data_tests:
          - not_null
      - name: event_ts
        description: Czas eventu (UTC).
        data_tests:
          - not_null
      - name: user_pseudo_id
        description: Identyfikator przeglądarki z cookie _ga.
        data_tests:
          - not_null
      - name: event_name
        description: Nazwa eventu GA4.
      - name: ab_test
        description: Parametr ab_test — klucz testu z tagu GTM.
      - name: ab_variant
        description: Parametr ab_variant — wylosowany wariant.
