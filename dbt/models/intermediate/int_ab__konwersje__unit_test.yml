# UNIT · testuje models/intermediate/int_ab__konwersje.sql
# Najprostszy unit test w projekcie — zacznij od niego, komentarz przy każdym kroku.

# Unit testy: sprawdzają, czy LOGIKA modelu jest poprawna — wiersze z given zamiast ref(),
# wynik porównany z expect. Plik YAML. Biegną tylko w CI (job unit-testy), przed modelem;
# deploy i harmonogram je pomijają. Tu: logika liczenia konwersji.
# Uruchamiają się w BigQuery, ale nie czytają GA4: dbt wstawia wiersze z given jako CTE.
# Przed pierwszym uruchomieniem modele nadrzędne muszą istnieć (dbt bierze z nich typy kolumn):
#   uv run dbt build --select +fct_wyniki_testow_ab --empty --full-refresh --resource-type seed --resource-type model
#   uv run dbt test --select test_type:unit
version: 2

unit_tests:
  # Najprostszy możliwy unit test — wzór do czytania. Jeden użytkownik, jeden test A/B, jedna reguła:
  # zakup liczy się jako konwersja tylko wtedy, gdy był PO pierwszej ekspozycji na test.
  # Budowa każdego unit testu jest zawsze ta sama:
  #   model  — który model sprawdzamy (tu int_ab__konwersje),
  #   given  — sztuczne dane wejściowe: po jednym bloku na każdy ref() z SQL modelu,
  #   expect — wiersze, które model MUSI zwrócić z tych danych. Inny wynik = test czerwony.
  - name: konwersje_tylko_po_ekspozycji
    description: >
      Użytkownik u1 zobaczył test o 12:00. Kupił o 11:00 (przed ekspozycją, nie liczy się)
      i o 13:00 (po ekspozycji, liczy się). Wynik: jeden wiersz z zakupem z 13:00.
    model: int_ab__konwersje
    given:
      # SQL modelu robi trzy ref(), więc są trzy wejścia. Brak któregoś = błąd kompilacji.
      # W rows wystarczą kolumny, których model używa; resztę kolumn dbt wypełnia sam.

      # 1) Rejestr testów (seed). Model bierze z niego: jakie zdarzenie jest konwersją
      #    i kiedy test się kończy (zakup po końcu testu nie liczyłby się).
      - input: ref('stg_seeds__rejestr_testow')
        rows:
          - {id_testu: ab1_20260907, zdarzenie_konwersji: purchase, koniec_testu: 2026-10-04}

      # 2) Ekspozycje — wynik poprzedniego modelu: kto i kiedy pierwszy raz zobaczył test.
      #    Tu u1 zobaczył go 10 września o 12:00.
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab1_20260907, id_uzytkownika: u1, czas_pierwszej_ekspozycji: '2026-09-10 12:00:00'}

      # 3) Zdarzenia z GA4 (staging). Dwa zakupy tego samego dnia:
      #    11:00 — godzinę PRZED ekspozycją, więc model ma go odrzucić,
      #    13:00 — godzinę PO ekspozycji, więc to pierwsza konwersja.
      - input: ref('stg_ga4__zdarzenia')
        rows:
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 11:00:00', data_zdarzenia: 2026-09-10}
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 13:00:00', data_zdarzenia: 2026-09-10}

    # Oczekiwany wynik: jeden wiersz, z zakupem z 13:00. Gdyby model liczył też zakup sprzed
    # ekspozycji, czas_pierwszej_konwersji wyszedłby 11:00 i test by padł.
    expect:
      rows:
        - {id_testu: ab1_20260907, id_uzytkownika: u1, czas_pierwszej_konwersji: '2026-09-10 13:00:00', data_pierwszej_konwersji: 2026-09-10}
