version: 2

unit_tests:
  - name: konwersje_tylko_po_ekspozycji
    model: int_ab__konwersje
    given:
      - input: ref('stg_seeds__rejestr_testow')
        rows:
          - {id_testu: ab2_20260907, zdarzenie_konwersji: purchase, koniec_testu: 2026-10-04}
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab2_20260907, id_uzytkownika: u1, czas_pierwszej_ekspozycji: '2026-09-10 12:00:00'}
          - {id_testu: ab2_20260907, id_uzytkownika: u2, czas_pierwszej_ekspozycji: '2026-09-10 12:00:00'}
      - input: ref('stg_ga4__zdarzenia')
        rows:
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 11:00:00', data_zdarzenia: 2026-09-10}
          - {id_uzytkownika: u2, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 13:00:00', data_zdarzenia: 2026-09-10}
    expect:
      rows:
        - {id_testu: ab2_20260907, id_uzytkownika: u2, czas_pierwszej_konwersji: '2026-09-10 13:00:00', data_pierwszej_konwersji: 2026-09-10}

  - name: konwersje_tylko_w_oknie_testu
    model: int_ab__konwersje
    given:
      - input: ref('stg_seeds__rejestr_testow')
        rows:
          - {id_testu: ab2_20260907, zdarzenie_konwersji: purchase, koniec_testu: 2026-10-04}
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab2_20260907, id_uzytkownika: u1, czas_pierwszej_ekspozycji: '2026-10-04 12:00:00'}
          - {id_testu: ab2_20260907, id_uzytkownika: u2, czas_pierwszej_ekspozycji: '2026-10-04 12:00:00'}
      - input: ref('stg_ga4__zdarzenia')
        rows:
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-10-05 09:00:00', data_zdarzenia: 2026-10-05}
          - {id_uzytkownika: u2, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-10-04 13:00:00', data_zdarzenia: 2026-10-04}
    expect:
      rows:
        - {id_testu: ab2_20260907, id_uzytkownika: u2, czas_pierwszej_konwersji: '2026-10-04 13:00:00', data_pierwszej_konwersji: 2026-10-04}

  - name: konwersje_przychod_raz_na_transakcje
    model: int_ab__konwersje
    given:
      - input: ref('stg_seeds__rejestr_testow')
        rows:
          - {id_testu: ab2_20260907, zdarzenie_konwersji: purchase, koniec_testu: 2026-10-04}
      - input: ref('int_ab__ekspozycje')
        rows:
          - {id_testu: ab2_20260907, id_uzytkownika: u1, czas_pierwszej_ekspozycji: '2026-09-10 12:00:00'}
      - input: ref('stg_ga4__zdarzenia')
        rows:
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 13:00:00', data_zdarzenia: 2026-09-10, przychod: 100, id_transakcji: T1, slot: ab2}
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 13:00:00', data_zdarzenia: 2026-09-10, przychod: 100, id_transakcji: T1, slot: ab5}
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-10 13:05:00', data_zdarzenia: 2026-09-10, przychod: 100, id_transakcji: T1}
          - {id_uzytkownika: u1, nazwa_zdarzenia: purchase, czas_zdarzenia: '2026-09-11 09:00:00', data_zdarzenia: 2026-09-11, przychod: 50, id_transakcji: T2}
    expect:
      rows:
        - {id_testu: ab2_20260907, id_uzytkownika: u1, czas_pierwszej_konwersji: '2026-09-10 13:00:00', data_pierwszej_konwersji: 2026-09-10, przychod: 150}
